<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="EduReach AI — Personalized Learning for Everyone." />
  <title>EduReach AI — Personalized Learning for Everyone</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='80'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">✦</div>
        <div>
          <div class="brand-name">EduReach</div>
          <div class="brand-tag">AI · LEARN · GROW</div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="dashboard"><span>⌂</span> Dashboard</button>
        <button class="nav-item" data-view="diagnostic"><span>◈</span> Diagnostic</button>
        <button class="nav-item" data-view="path"><span>↗</span> Learning Path</button>
        <button class="nav-item" data-view="practice"><span>✓</span> Practice</button>
        <button class="nav-item" data-view="insights"><span>◌</span> AI Insights</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="lite-card">
          <div class="tiny-label">LOW-BANDWIDTH MODE</div>
          <div class="lite-row"><span class="status-dot"></span><span>Optimized</span></div>
          <p>Minimal data, fast loading, focused learning.</p>
        </div>
        <div class="side-note">Demo prototype · EduReach AI</div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">PERSONALIZED LEARNING PLATFORM</div>
          <h1 id="pageTitle">Good afternoon, Muhammad.</h1>
        </div>
        <div class="top-actions">
          <button class="icon-btn" title="Low bandwidth mode">◒</button>
          <div class="avatar">MA</div>
        </div>
      </header>

      <section id="view-dashboard" class="view active-view"></section>
      <section id="view-diagnostic" class="view"></section>
      <section id="view-path" class="view"></section>
      <section id="view-practice" class="view"></section>
      <section id="view-insights" class="view"></section>
    </main>
  </div>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
